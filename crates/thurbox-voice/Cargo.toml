[package]
name = "thurbox-voice"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local dictation for thurbox"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
transcribe-rs = { version = "0.3.12", features = ["onnx", "whisper-cpp"] }
ureq = "3.4.2"
whisper-rs = "0.16.0"

# Whisper on the GPU where there is one to use.
[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { version = "0.3.12", features = ["whisper-metal"] }
